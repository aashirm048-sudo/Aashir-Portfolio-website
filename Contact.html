<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; overflow-x: hidden; }

        nav {
            min-height: 70px;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            border-bottom: 3px solid white;
            padding: 10px;
        }
        .li { font-size: 18px; cursor: pointer; }
        a { color: white; text-decoration: none; }
        nav img { border-radius: 50%; border: 2px solid white; }

        .banner {
            height: 300px;
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTK5xTT8Mbh4o8VX7Bu2jOdCIuo7maQgwandOR3j7mcGESmmq0xcOLoKw0&s=10');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: black;
        }
        .banner h1 { font-size: 2.8rem; margin: 0; }
        .banner button {
            font-size: 18px;
            padding: 10px 20px;
            background-color: rgb(5, 71, 94);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        .main-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 40px;
        }

        .contact-form {
            flex: 1;
            min-width: 300px;
        }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .contact-info {
            flex: 1;
            min-width: 300px;
            background-color: #f9f9f9;
            padding: 25px;
            border-radius: 8px;
        }
        .contact-info h2 { margin-top: 0; }
        .social-icons img { width: 50px; height: 50px; margin-top: 10px; }

        @media (max-width: 768px) {
            nav { flex-direction: column; gap: 10px; }
            .main-container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <img src="Aashir portfolio.png" height="50" width="50" alt="Logo">
            <a href="./index.html"><div class="li">Home</div></a>
            <a href="./About.html"><div class="li">About Me</div></a>
            <a href="./Contact.html"><div class="li">Contact Me</div></a>
            <a href="./project.html"><div class="li">My Project</div></a>
            <a href="./skills.html"><div class="li">Skills</div></a>
        </nav>
        <div class="banner" data-aos="zoom-in">
            <h1>Contact Me</h1>
            <button>Tell me your information</button>
        </div>
    </header>

    <div class="main-container">
        <div class="contact-form" data-aos="fade-right">
            <h2>Send Me Your Information</h2>
            <input id="name" type="text" placeholder="Your Name">
            <input id="email" type="text" placeholder="Your Email Address">
            <input id="password" type="text" placeholder="Enetr Your password ">
            <textarea rows="5" placeholder="Your Message"></textarea>
            <button id="btn"  style="padding: 10px 20px; background: rgb(5, 71, 94); color: white; border: none; cursor: pointer;">Send Message</button>
        </div>

        <div class="contact-info" data-aos="fade-left">
            <h2>Contact Info</h2>
            <h3>Address</h3>
            <p>A1-110 Salman Terrace, Malir Karachi</p>

            <h3>My Email</h3>
            <p>aashirm048@gmail.com</p>

            <h3>Call me on WhatsApp</h3>
            <p>03003576512</p>

            <h3>Follow Me</h3>
            <div class="social-icons">
                <a href="https://wa.me/923003576512" target="_blank">
                    <img src="https://img.magnific.com/premium-vector/vector-whatsapp-social-media-logo_1093524-447.jpg?semt=ais_hybrid&w=740&q=80" alt="WhatsApp">
                </a>
            </div>
        </div>
    </div>
       <script type="module" src="app.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
